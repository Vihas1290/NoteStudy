<script>

  bg:'rgb(var(--bg) / <alpha-value>)', surface:'rgb(var(--surface) / <alpha-value>)', surface2:'rgb(var(--surface2) / <alpha-value>)', edge:'rgb(var(--edge) / <alpha-value>)',
  ink:'#E7ECF6', muted:'#8993AB', accent:'rgb(var(--accent) / <alpha-value>)', violet:'#C084FC',

<style>
  :root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html,body{ height:100%; }
  :root{ --bg:10 14 23; --surface:19 26 41; --surface2:27 36 54; --edge:35 45 66; --accent:94 234 212; }
  body{ background-color:rgb(var(--bg)); background-image:radial-gradient(circle at 15% -10%, rgb(var(--accent) / .09), transparent 40%), radial-gradient(circle at 100% 0%, rgb(var(--accent) / .05), transparent 35%); background-attachment:fixed; transition:background-color .4s ease; }
  .pop{ animation:pop .5s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop{ from{opacity:0; transform:scale(.8)} to{opacity:1; transform:scale(1)} }
  .sparkle{ animation:tw 1.6s ease-in-out infinite; }
  @keyframes tw{ 50%{opacity:.25} }
  .fadein{ animation:fadein .5s ease both; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
  .qcard{ animation:qin .35s ease both; }
  @keyframes qin{ from{opacity:0; transform:translateX(14px)} to{opacity:1; transform:translateX(0)} }
  .ring{ transition: stroke-dashoffset 1s cubic-bezier(.4,0,.2,1); }
  ::selection{ background:rgb(var(--accent) / .25); }
  /* logo */
  .logo{ position:relative; display:inline-block; line-height:0; }
  .logo img{ position:relative; height:100%; width:auto; display:block; user-select:none; -webkit-user-drag:none; }
  .bulb-glow{ position:absolute; left:60%; top:34%; width:78%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle, rgba(250,204,21,.6) 0%, rgba(250,204,21,.22) 38%, transparent 68%); animation:bulb 3.2s ease-in-out infinite; pointer-events:none; }
  @keyframes bulb{ 0%,100%{ opacity:.45; transform:translate(-50%,-50%) scale(.9); } 50%{ opacity:1; transform:translate(-50%,-50%) scale(1.12); } }
  /* landing */
  .landing-bg{ position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
  .landing-bg::before{ content:''; position:absolute; inset:0; background-image:linear-gradient(rgb(var(--accent) / .07) 1px, transparent 1px), linear-gradient(90deg, rgb(var(--accent) / .07) 1px, transparent 1px); background-size:44px 44px; -webkit-mask-image:radial-gradient(ellipse 75% 55% at 50% 28%, #000 15%, transparent 75%); mask-image:radial-gradient(ellipse 75% 55% at 50% 28%, #000 15%, transparent 75%); }
  .orb{ position:absolute; border-radius:50%; filter:blur(80px); opacity:.28; background:rgb(var(--accent)); animation:drift 14s ease-in-out infinite alternate; }
  @keyframes drift{ to{ transform:translate(46px,-34px) scale(1.15); } }
  .grad{ display:inline-block; padding-bottom:.1em; background:linear-gradient(95deg, rgb(var(--accent)) 10%, #E7ECF6 95%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .cta{ box-shadow:0 0 0 1px rgb(var(--accent) / .45), 0 12px 44px -12px rgb(var(--accent) / .7); transition:transform .18s ease, box-shadow .18s ease; }
  .cta:hover{ transform:translateY(-2px); box-shadow:0 0 0 1px rgb(var(--accent) / .7), 0 18px 54px -12px rgb(var(--accent) / .85); }
  .cta:active{ transform:scale(.98); }
  .num{ color:transparent; -webkit-text-stroke:1px rgb(var(--accent) / .75); }
  /* in-view animations: JS adds .in when the element scrolls into range */
  [data-anim]{ opacity:0; transition:opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1), filter .8s ease; transition-delay:calc(var(--i,0) * 90ms); }
  [data-anim="up"]{ transform:translateY(26px); }
  [data-anim="left"]{ transform:translateX(-30px); }
  [data-anim="right"]{ transform:translateX(30px); }
  [data-anim="scale"]{ transform:scale(.93); }
  [data-anim="blur"]{ transform:translateY(16px); filter:blur(9px); }
  [data-anim].in{ opacity:1; transform:none; filter:none; }
  .draw{ position:relative; }
  .draw::before{ content:''; position:absolute; left:0; top:-1px; height:1px; width:100%; background:linear-gradient(90deg, rgb(var(--accent)), rgb(var(--accent) / 0)); transform:scaleX(0); transform-origin:left; transition:transform 1.1s cubic-bezier(.2,.8,.2,1); transition-delay:calc(var(--i,0) * 90ms + .25s); }
  .draw.in::before{ transform:scaleX(1); }
  .glow-in{ opacity:0; transition:opacity 1.4s ease .3s; }
  .in .glow-in{ opacity:1; }
  .pulse-ring{ position:absolute; width:280px; height:280px; border-radius:50%; border:1px solid rgb(var(--accent) / .5); animation:pring 4.8s ease-out infinite; }
  @keyframes pring{ from{ transform:scale(.55); opacity:.55; } to{ transform:scale(1.55); opacity:0; } }
  #demo .layer{ transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1), filter .6s ease; }
  #demo[data-stage="2"] .demo-note, #demo[data-stage="3"] .demo-note{ opacity:0; transform:translateY(-18px) scale(.96); filter:blur(5px); }
  #demo .demo-quiz{ opacity:0; transform:translateY(22px) scale(.96); }
  #demo[data-stage="2"] .demo-quiz, #demo[data-stage="3"] .demo-quiz{ opacity:1; transform:none; }
  #demo .hl{ color:rgb(var(--accent)); background:linear-gradient(transparent 62%, rgb(var(--accent) / .4) 0); border-radius:2px; }
  #demo[data-stage="1"] .hl{ animation:hlpulse 1.1s ease-in-out; }
  @keyframes hlpulse{ 50%{ background:linear-gradient(transparent 0, rgb(var(--accent) / .45) 0); } }
  #demo .demo-opt{ transition:border-color .35s, background-color .35s, opacity .35s; }
  #demo[data-stage="3"] .demo-opt.right{ border-color:#4ADE80; background:rgb(74 222 128 / .12); }
  #demo[data-stage="3"] .demo-opt:not(.right){ opacity:.4; }
  #demo .tick{ opacity:0; transition:opacity .3s .2s; }
  #demo[data-stage="3"] .tick{ opacity:1; color:#4ADE80; }
  #demo .pts{ opacity:0; transform:translateY(8px) scale(.8); transition:opacity .4s, transform .5s cubic-bezier(.2,1.4,.4,1); }
  #demo[data-stage="3"] .pts{ opacity:1; transform:none; }
  .caret{ display:inline-block; width:2px; height:1em; background:rgb(var(--accent)); margin-left:2px; vertical-align:-2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;} [data-anim]{ opacity:1 !important; transform:none !important; filter:none !important; } .draw::before{ transform:scaleX(1); } .glow-in{ opacity:1; } }
</style>

/* ---------- notes parsing ---------- */
const HEADING_RE = /^(#{1,6}\s+.+|[A-Z][A-Za-z0-9 ,'&/-]{2,60}:?$)/;
function splitSections(text){
  const lines = text.split('\n'); let sections = []; let heading = 'Full notes'; let body = [];
  const flush = () => { const t = body.join('\n').trim(); if(t) sections.push({heading, text:t}); };
  for(const raw of lines){
    const line = raw.trim();
    if(!line){ body.push(''); continue; }
    if(HEADING_RE.test(line) && line.length < 80){ flush(); heading = line.replace(/^#+\s*/, '').replace(/:$/, ''); body = []; }
    else body.push(line);
  }
  flush();
  return sections.length ? sections : [{heading:'Full notes', text: text.trim()}];
}

/* ---------- document parsing (pdf / docx / pptx) ---------- */
async function extractPdfText(buf){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n\n';
  }
  return text;
}
async function extractDocxText(buf){
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return result.value;
}
async function extractPptxText(buf){
  const zip = await JSZip.loadAsync(buf);
  const slideFiles = Object.keys(zip.files)
    .filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f))
    .sort((a, b) => parseInt(a.match(/slide(\d+)/)[1]) - parseInt(b.match(/slide(\d+)/)[1]));
  const slides = [];
  for(const f of slideFiles){
    const xml = await zip.files[f].async('string');
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    const texts = [...doc.getElementsByTagName('a:t')].map(n => n.textContent).join(' ').trim();
    const num = f.match(/slide(\d+)/)[1];
    if(texts) slides.push(`Slide ${num}\n${texts}`);
  }
  return slides.join('\n\n');
}
async function extractFileText(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext === 'txt') return await file.text();
  if(ext === 'pdf') return await extractPdfText(await file.arrayBuffer());
  if(ext === 'docx') return await extractDocxText(await file.arrayBuffer());
  if(ext === 'pptx') return await extractPptxText(await file.arrayBuffer());
  throw new Error('unsupported');
}

/* ---------- offline question generator ---------- */
const STOP = new Set(['the','and','for','that','with','this','from','have','are','was','were','which','their','into','also','such','when','where','while','than','then','these','those','over','under','each','some','will','can','may','not','but','its','his','her','you','your','our','who','whom','how','what','why']);
function sentences(text){
  const clean = text.replace(/\s+/g,' ').trim();
  return clean.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>=35 && s.length<=220);
}
function keyTerm(s){
  const nums = s.match(/\b\d[\d,.]*%?\b/g);
  if(nums) return nums.sort((a,b)=>b.length-a.length)[0];
  const caps = (s.match(/\b[A-Z][a-zA-Z]{2,}(?:\s[A-Z][a-zA-Z]{2,})*\b/g)||[]).filter(c=>!STOP.has(c.toLowerCase()));
  if(caps.length) return caps.sort((a,b)=>b.length-a.length)[0];
  const words = (s.match(/[A-Za-z][A-Za-z\-']+/g)||[]).filter(w=>!STOP.has(w.toLowerCase()) && w.length>5);
  if(words.length) return words.sort((a,b)=>b.length-a.length)[0];
  return null;
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function generateQuestions(text, difficulty, count, types){
  let sents = sentences(text);
  sents = difficulty==='easy' ? sents.sort((a,b)=>a.length-b.length)
        : difficulty==='hard' ? sents.sort((a,b)=>b.length-a.length)
        : shuffle(sents);
  const allTerms = sents.map(keyTerm).filter(Boolean);
  const cycle = types.length ? types : ['mcq'];
  const qs = []; let i = 0;
  for(const s of sents){
    if(qs.length >= count) break;
    const term = keyTerm(s); if(!term) continue;
    const type = cycle[i % cycle.length]; i++;
    if(type === 'mcq'){
      const pool = shuffle(allTerms.filter(t=>t.toLowerCase()!==term.toLowerCase()));
      const n = difficulty==='easy' ? 2 : 3;
      const options = shuffle([...pool.slice(0,n), term]);
      qs.push({id:uid(), type, prompt:`Fill in the blank: ${s.replace(term,'_____')}`, options, answer:term, source:s});
    } else if(type === 'true_false'){
      const makeFalse = Math.random() < 0.5 && allTerms.length > 1;
      let statement = s, isTrue = true;
      if(makeFalse){ const other = shuffle(allTerms.filter(t=>t!==term))[0] || term; statement = s.replace(term, other); isTrue = false; }
      qs.push({id:uid(), type, prompt:`True or false: ${statement}`, options:['True','False'], answer: isTrue?'True':'False', source:s});
    } else {
      qs.push({id:uid(), type:'short_answer', prompt:`According to your notes, what completes: "${s.replace(term,'_____')}"?`, options:[], answer:term, source:s});
    }
  }
  return qs.slice(0, count);
}
function normalize(s){ return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').trim(); }
function isCorrect(type, given, answer){
  const g = normalize(given), c = normalize(answer);
  if(!g) return false;
  if(type !== 'short_answer') return g === c;
  if(g===c || g.includes(c) || c.includes(g)) return true;
  const gw = new Set(g.split(' ')), cw = new Set(c.split(' '));
  if(!cw.size) return false;
  let overlap = 0; cw.forEach(w=>{ if(gw.has(w)) overlap++; });
  return overlap / cw.size >= 0.6;
}

function countUp(el, instant){
  const to = parseFloat(el.dataset.count) || 0, dec = +(el.dataset.dec || 0), suf = el.dataset.suffix || '';
  const fmt = v => v.toFixed(dec) + suf;
  if(instant){ el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 1300;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = fmt(to * (1 - Math.pow(1 - k, 3)));

  };

}
function setupAnims(fresh){

    if(el.hasAttribute('data-anim')) el.classList.add('in');
    if(el.hasAttribute('data-count')) countUp(el, instant || force);

  if(instant || !('IntersectionObserver' in window)){ els.forEach(el => reveal(el, true)); return; }

const cloudSigOf = o => JSON.stringify({ nick: o.nick, points: Number(o.points) || 0, lifetime: Number(o.lifetime) || 0, owned: o.owned, equipped: o.equipped });
const localCloudSig = () => cloudSigOf({ nick: profile.account ? profile.account.nick : '', ...snapshot() });
const cloudPath = () => 'data/users/' + myId + '/profile';

/* ----- password hashing (PBKDF2-SHA256 via WebCrypto) ----- */
const PW_ITER = 300000;
const NO_CRYPTO = 'This browser cannot protect passwords, so password accounts are unavailable here.';
const hasCrypto = () => !!(window.crypto && window.crypto.subtle && window.TextEncoder);
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const newSalt = () => toB64(window.crypto.getRandomValues(new Uint8Array(16)));
async function hashPassword(pw, saltB64, iter){
  const key = await window.crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await window.crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(saltB64), iterations: iter }, key, 256);
  return toB64(bits);
}
const toB64u = buf => toB64(buf).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const fromB64u = s => fromB64(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
async function deriveAesKey(pw, saltB64, iter){
  const base = await window.crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return window.crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(saltB64), iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
const safeEqual = (a, b) => { if(a.length !== b.length) return false; let r = 0; for(let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i); return r === 0; };
const cleanNick = s => String(s || '').replace(/\s+/g, ' ').trim();
const userKey = s => cleanNick(s).normalize('NFKC').toLowerCase();
function nickError(s){
  if(s.length < 2 || s.length > 20) return 'Use 2 to 20 characters.';
  if(!/^[\p{L}\p{N} ._-]+$/u.test(s)) return 'Use letters, numbers, spaces, dots, dashes or underscores.';
  return '';
}
function usernameError(s){
  if(s.length < 3 || s.length > 20) return 'Use 3 to 20 characters for your username.';
  if(!/^[A-Za-z0-9._-]+$/.test(s)) return 'Use letters, numbers, dots, dashes or underscores (no spaces).';
  return '';
}
const COMMON_PW = new Set(['password','password1','12345678','123456789','1234567890','qwertyuiop','qwerty123','11111111','iloveyou','abcd1234','00000000','letmein1']);
function passwordError(pw, user){
  if(pw.length < 8) return 'Use at least 8 characters.';
  if(pw.length > 64) return 'Use 64 characters or fewer.';
  if(COMMON_PW.has(pw.toLowerCase())) return 'That password is too easy to guess.';
  if(user && pw.toLowerCase() === String(user).toLowerCase()) return 'Your password cannot be your username.';
  return '';
}
function strengthOf(pw){
  let s = 0; if(pw.length >= 8) s++; if(pw.length >= 12) s++; if(/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++; if(/\d/.test(pw)) s++; if(/[^A-Za-z0-9]/.test(pw)) s++;
  return !pw ? 0 : s <= 2 ? 1 : s <= 3 ? 2 : 3;
}
/* gentle brute-force slowdown (client side only) */
const failBook = DB.get('ntq_fail', {});
const lockedFor = key => { const f = failBook[key]; return f && f.until > Date.now() ? Math.ceil((f.until - Date.now()) / 1000) : 0; };
function noteFail(key){ const f = failBook[key] || { n: 0 }; f.n++; if(f.n >= 5) f.until = Date.now() + 30000 * Math.min(f.n - 4, 10); failBook[key] = f; DB.set('ntq_fail', failBook); }
function clearFail(key){ delete failBook[key]; DB.set('ntq_fail', failBook); }

/* ----- login records: shared account storage when signed in to Claude, else this device ----- */
const localLogins = () => DB.get('ntq_logins', {});
async function loginGet(where, key){
  if(where === 'cloud'){ if(!boardDb) throw new Error('offline'); const s = await boardDb.doc('logins/' + key).get(); return s.exists ? s.data() : null; }
  return localLogins()[key] || null;
}
async function loginPut(where, key, rec){
  if(where === 'cloud'){ if(!boardDb) throw new Error('offline'); await boardDb.doc('logins/' + key).set(rec); }
  else { const all = localLogins(); all[key] = rec; DB.set('ntq_logins', all); }
}
async function loginPatch(where, key, patch){
  if(where === 'cloud'){ if(!boardDb) throw new Error('offline'); await boardDb.doc('logins/' + key).update(patch); }
  else { const all = localLogins(); if(all[key]) all[key] = { ...all[key], ...patch }; DB.set('ntq_logins', all); }
}
async function loginDel(where, key){
  if(where === 'cloud'){ if(!boardDb) throw new Error('offline'); await boardDb.doc('logins/' + key).delete(); }
  else { const all = localLogins(); delete all[key]; DB.set('ntq_logins', all); }
}
const OFFLINE_MSG = 'We cannot reach your account right now. Please try again in a moment.';

/* ----- syncing ----- */
async function syncBoard(){
  const a = profile.account;
  if(!a || a.mode === 'guest') return;
  if(syncing){ syncQueued = true; return; }
  syncing = true;
  try{
    do{
      syncQueued = false;
      if(boardDb && myId){
        const sig = mySig();
        if(sig !== lastSig){
          const ref = boardDb.doc('leaderboard/' + myId);
          if(profile.lifetime > 0) await ref.set(boardBody()); else await ref.delete();
          lastSig = sig;
        }
      }
      const csig = localCloudSig();
      if(csig !== lastCloudSig){
        const payload = { nick: a.nick, ...snapshot(), createdAt: a.createdAt || 0, savedAt: Date.now() };
        if(a.mode === 'cloud' && boardDb && myId){
          await boardDb.doc(cloudPath()).set(payload); cloudProfile = payload; lastCloudSig = csig;
        } else if(a.mode === 'password'){
          await loginPatch(a.where, a.key, { nick: a.nick, profile: snapshot(), savedAt: payload.savedAt }); lastCloudSig = csig;
        }
      }
      cloudStatus = 'ok';
    } while(syncQueued);
  } catch(e){ cloudStatus = 'error'; }
  finally{ syncing = false; if(state.view === 'shop') render(); else refreshAccount(); }
}
async function flushSync(){ syncBoard(); for(let i = 0; i < 100 && syncing; i++) await new Promise(r => setTimeout(r, 40)); }
function resetProfile(){ profile = defaultProfile(); lastSig = ''; lastCloudSig = ''; cloudStatus = 'idle'; save(); }
const validItems = ids => (Array.isArray(ids) ? ids : []).filter(id => getItem(id));
// The remote copy wins when it has more progress (lifetime points only ever go up).
const remoteIsAhead = d => (Number(d.lifetime) || 0) > profile.lifetime || ((Number(d.lifetime) || 0) === profile.lifetime && (Number(d.savedAt) || 0) > (profile.savedAt || 0));
function adoptProfile(d){
  const owned = [...new Set([...defaultProfile().owned, ...validItems(d.owned)])];
  const eq = { ...defaultProfile().equipped, ...(d.equipped || {}) };
  ['theme','color','costume'].forEach(k => { if(eq[k] && !owned.includes(eq[k])) eq[k] = defaultProfile().equipped[k]; });
  profile.points = Number(d.points) || 0; profile.lifetime = Number(d.lifetime) || 0; profile.owned = owned; profile.equipped = eq;
}

/* ----- account actions ----- */
async function createPasswordAccount(username, pw){
  await authReady;
  const key = userKey(username), where = boardDb ? 'cloud' : 'device';
  if(await loginGet(where, key) || (where === 'cloud' && localLogins()[key])) return { error: 'That username is taken. Try another one.' };
  const salt = newSalt(), hash = await hashPassword(pw, salt, PW_ITER), createdAt = Date.now();
  await loginPut(where, key, { nick: username, salt, iter: PW_ITER, hash, createdAt, profile: snapshot(), savedAt: createdAt });
  const back = await loginGet(where, key);
  if(!back || back.salt !== salt) return { error: 'That username was just taken. Try another one.' };
  const legacy = profile.account && profile.account.mode === 'cloud';
  profile.account = { nick: username, mode: 'password', key, where, createdAt }; save();
  lastSig = ''; lastCloudSig = cloudSigOf({ nick: username, ...snapshot() });
  if(legacy && boardDb && myId){ try{ await boardDb.doc(cloudPath()).delete(); cloudProfile = null; } catch(e){} }
  cloudStatus = 'ok'; syncBoard();
  return { ok: true };
}
async function loginAccount(username, pw){
  const key = userKey(username), wait = lockedFor(key);
  if(wait) return { error: `Too many tries. Wait ${wait} seconds and try again.` };
  await authReady;
  let rec = null, where = null;
  if(boardDb){ rec = await loginGet('cloud', key); if(rec) where = 'cloud'; }
  if(!rec){ rec = localLogins()[key] || null; if(rec) where = 'device'; }
  const bad = { error: 'Wrong username or password.' };
  if(!rec || !rec.salt){ noteFail(key); return bad; }
  const h = await hashPassword(pw, rec.salt, rec.iter || PW_ITER);
  if(!safeEqual(h, rec.hash)){ noteFail(key); return bad; }
  clearFail(key);
  if(profile.account && !(profile.account.mode === 'password' && profile.account.key === key)) resetProfile();   // switching accounts
  const remote = rec.profile || {};
  if(remoteIsAhead(remote)) adoptProfile(remote);
  profile.account = { nick: rec.nick, mode: 'password', key, where, createdAt: rec.createdAt || 0 }; save();
  lastSig = ''; lastCloudSig = ''; syncBoard();
  return { ok: true };
}
async function changePassword(oldPw, newPw){
  const a = profile.account; await authReady;
  const rec = await loginGet(a.where, a.key);
  if(!rec) return { error: 'We could not find your account. Log in again.' };
  const h = await hashPassword(oldPw, rec.salt, rec.iter || PW_ITER);
  if(!safeEqual(h, rec.hash)) return { error: 'Your current password is wrong.' };
  const salt = newSalt(), hash = await hashPassword(newPw, salt, PW_ITER);
  await loginPatch(a.where, a.key, { salt, iter: PW_ITER, hash });
  return { ok: true };
}
/* Backup code: lets an account move between devices with no server at all.
   The code is the account data encrypted with the account's own password (AES-GCM). */
async function makeBackup(pw){
  const a = profile.account; await authReady;
  const rec = await loginGet(a.where, a.key);
  if(!rec) return { error: 'We could not find your account.' };
  const h = await hashPassword(pw, rec.salt, rec.iter || PW_ITER);
  if(!safeEqual(h, rec.hash)) return { error: 'That password is wrong.' };
  const salt = newSalt(), key = await deriveAesKey(pw, salt, PW_ITER), iv = window.crypto.getRandomValues(new Uint8Array(12));
  const plain = new TextEncoder().encode(JSON.stringify({ nick: a.nick, createdAt: a.createdAt || 0, profile: snapshot() }));
  const ct = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain);
  const pkt = { v: 1, u: a.nick, s: salt, i: PW_ITER, n: toB64(iv), c: toB64(ct) };
  return { code: 'NSB1.' + toB64u(new TextEncoder().encode(JSON.stringify(pkt))) };
}
async function importBackup(code, pw){
  const bad = { error: 'That backup code is not valid. Copy the whole code and try again.' };
  let pkt; try{ pkt = JSON.parse(new TextDecoder().decode(fromB64u(String(code).trim().replace(/\s+/g, '').replace(/^NSB1\./, '')))); } catch(e){ return bad; }
  if(!pkt || pkt.v !== 1 || !pkt.s || !pkt.n || !pkt.c || !(pkt.i > 0 && pkt.i <= 2000000)) return bad;
  const wait = lockedFor(userKey(pkt.u || '')); if(wait) return { error: `Too many tries. Wait ${wait} seconds and try again.` };
  let data;
  try{ data = JSON.parse(new TextDecoder().decode(await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(pkt.n) }, await deriveAesKey(pw, pkt.s, pkt.i), fromB64(pkt.c)))); }
  catch(e){ noteFail(userKey(pkt.u || '')); return { error: 'Wrong password, or the code was damaged.' }; }
  if(!data || !data.nick || usernameError(String(data.nick))) return bad;
  await authReady;
  const key = userKey(data.nick), where = boardDb ? 'cloud' : 'device';
  let rec = await loginGet(where, key);
  if(rec){
    const h = await hashPassword(pw, rec.salt, rec.iter || PW_ITER);
    if(!safeEqual(h, rec.hash)) return { error: 'That username already exists here with a different password.' };
  } else {
    const salt = newSalt(), hash = await hashPassword(pw, salt, PW_ITER);
    rec = { nick: data.nick, salt, iter: PW_ITER, hash, createdAt: data.createdAt || Date.now(), profile: data.profile || {}, savedAt: Date.now() };
    await loginPut(where, key, rec);
  }
  clearFail(key);
  if(profile.account && !(profile.account.mode === 'password' && profile.account.key === key)) resetProfile();
  [rec.profile || {}, data.profile || {}].forEach(p => { if(remoteIsAhead(p)) adoptProfile(p); });
  profile.account = { nick: rec.nick, mode: 'password', key, where, createdAt: rec.createdAt || 0 }; save();
  lastSig = ''; lastCloudSig = ''; syncBoard();
  return { ok: true };
}
async function deleteAccount(pw, alsoNotes){
  const a = profile.account; await authReady;
  if(a && a.mode === 'password'){
    const rec = await loginGet(a.where, a.key);
    if(rec){
      const h = await hashPassword(pw || '', rec.salt, rec.iter || PW_ITER);
      if(!safeEqual(h, rec.hash)) return { error: 'That password is wrong, so nothing was deleted.' };
      await loginDel(a.where, a.key);
    }
  }
  if(a && a.mode !== 'guest' && boardDb && myId){ try{ await boardDb.doc('leaderboard/' + myId).delete(); await boardDb.doc(cloudPath()).delete(); } catch(e){} }
  if(a && a.key) clearFail(a.key);
  cloudProfile = null;
  if(alsoNotes){ notes = []; quizzes = []; attempts = []; pendingFiles = []; ['ntq_notes','ntq_quizzes','ntq_attempts'].forEach(k => localStorage.removeItem(k)); }
  resetProfile();
  return { ok: true };
}
async function initBoard(){
  try{
    if(!window.claude || !window.claude.use){ boardState = 'off'; authState = 'none'; refreshBoardView(); return; }
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const me = user ? await user.me() : null;
    if(!db || !user || !me || !me.id){ boardState = 'off'; authState = 'none'; refreshBoardView(); return; }
    boardDb = db; boardUser = user; myId = me.id;
    authMe = { id: me.id, name: me.name || '', avatar: me.avatarUrl || '' };
    try{ const snap = await db.doc(cloudPath()).get(); cloudProfile = snap.exists ? snap.data() : null; } catch(e){ cloudProfile = null; }
    authState = 'ready';
    const a = profile.account;
    if(a && a.mode === 'cloud'){
      if(cloudProfile && remoteIsAhead(cloudProfile)){ adoptProfile(cloudProfile); save(); if(state.view !== 'quiz') render(); }
      if(cloudProfile) lastCloudSig = cloudSigOf(cloudProfile);
    }
    if(a && a.mode !== 'guest'){
      try{
        const mine = await db.doc('leaderboard/' + myId).get();
        if(mine.exists){ const d = mine.data(); lastSig = JSON.stringify({ lifetime: Number(d.lifetime) || 0, points: typeof d.points === 'number' ? d.points : -1, color: d.color, costume: d.costume ?? null, nick: d.nick || '', acct: d.acct || '' }); }
      } catch(e){}
    }
    db.collection('leaderboard').limit(200).onSnapshot(async snap => {
      const raw = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      let ps = {};
      try{ ps = await boardUser.profiles(raw.map(r => r.id)); } catch(e){}
      const best = new Map();
      raw.forEach(r => {
        const row = {
          id: r.id, acct: String(r.acct || ''), lifetime: Number(r.lifetime) || 0, points: typeof r.points === 'number' ? r.points : null, color: r.color, costume: r.costume,
          name: String(r.nick || '').slice(0, 20) || (ps[r.id] && ps[r.id].name) || 'Student'
        };
        const k = row.acct || row.id, cur = best.get(k);
        if(!cur || row.lifetime > cur.lifetime) best.set(k, row);   // one row per account, even if used from several Claude accounts
      });
      boardRows = [...best.values()];
      boardState = 'ready'; refreshBoardView();
    }, () => { boardState = 'off'; refreshBoardView(); });
  } catch(e){ boardState = 'off'; authState = 'none'; refreshBoardView(); }
  finally{
    resolveAuth();
    try{   // an account deleted from another device should not linger here
      const a = profile.account;
      if(a && a.mode === 'password' && (a.where === 'device' || boardDb)){
        if(!(await loginGet(a.where, a.key))){ resetProfile(); state.flash = 'That account was deleted, so you were signed out.'; if(state.view !== 'quiz') render(); return; }
        syncBoard();
      } else if(a && a.mode === 'cloud') syncBoard();
    } catch(e){}
    refreshAccount();
  }
}

const rowsWithMe = () => boardRows.map(r => ({ ...r, isMe: r.id === myId || !!(profile.account && profile.account.key && r.acct === profile.account.key) }));

function viewBoard(){
  const tab = state.boardTab === 'now' ? 'now' : 'all';
  const metric = r => tab === 'now' ? r.points : r.lifetime;
  const list = rowsWithMe().filter(r => metric(r) !== null).sort((a, b) => metric(b) - metric(a) || b.lifetime - a.lifetime);
  const top = list.slice(0, 25);
  const rank = list.findIndex(r => r.isMe) + 1;
  const medals = ['🥇','🥈','🥉'];
  const mine = tab === 'now' ? profile.points : profile.lifetime;
  let body;
  if(boardState === 'loading') body = `<div class="rounded-2xl border border-edge bg-surface p-6 text-center text-sm text-muted" role="status">Loading the leaderboard…</div>`;
  else if(boardState === 'off') body = `<div class="rounded-2xl border border-edge bg-surface p-5 text-sm text-muted" role="status">The shared leaderboard isn't available on this page right now. Your own totals are shown above.</div>`;
  else if(!top.length) body = `<div class="rounded-2xl border border-edge bg-surface p-6 text-center fadein"><p class="font-display font-semibold">Nobody is on the board yet</p><p class="text-sm text-muted mt-1">Finish a quiz to claim the first spot.</p></div>`;
  else body = `<ol class="space-y-2" aria-label="${tab === 'now' ? 'Current points' : 'All time'} ranking">${top.map((r, i) => {
    const color = getItem(r.color) || ITEMS.find(x => x.id === 'color_default');
    const costume = getItem(r.costume);
    const av = avatarSVG(36, color.v, costume ? costume.v.kind : null);
    return `<li data-anim="up" style="--i:${i % 8}" class="flex items-center gap-3 rounded-xl border px-3 py-2.5 ${r.isMe ? 'border-accent/60 bg-accent/10' : 'border-edge bg-surface'}">
      <span class="w-7 text-center font-display font-semibold ${i < 3 ? 'text-lg' : 'text-sm text-muted'}">${i < 3 ? medals[i] : i + 1}</span>
      <span class="block rounded-full bg-surface2 overflow-hidden shrink-0">${av}</span>
      <span class="flex-1 min-w-0 truncate text-sm font-medium">${escapeHtml(r.name)}${r.isMe ? ' <span class="text-accent text-xs">(you)</span>' : ''}</span>
      <span class="font-display font-semibold text-accent">${metric(r).toLocaleString()}</span>
    </li>`; }).join('')}</ol>`;
  const joinBanner = (!profile.account || profile.account.mode === 'guest') ? `<div class="rounded-2xl border border-accent/30 bg-accent/10 p-4 mb-5 flex items-center gap-3 fadein"><p class="flex-1 text-sm">${profile.account ? "Guests aren't ranked." : 'New here?'} Create an account to save your points and join the leaderboard.</p><button data-nav="account" class="rounded-xl bg-accent text-bg font-semibold px-4 py-2.5 text-sm shrink-0">Account</button></div>` : '';
  return `
  ${joinBanner}
  <header class="pt-8 pb-4 fadein">
    <h1 class="font-display text-2xl font-semibold">Leaderboard</h1>
    <p class="text-sm text-muted mt-1">${tab === 'now' ? "Ranked by the points in each player's bank right now. Buying lowers your spot; selling raises it." : 'Ranked by total lifetime points. Spending or selling never lowers your rank.'}</p>
  </header>
  <div class="flex gap-2 mb-4" role="tablist">
    ${[['all','All time'],['now','Current points']].map(([k, l]) => `<button data-btab="${k}" role="tab" aria-selected="${tab === k}" class="flex-1 rounded-xl border px-3 py-2.5 text-sm ${tab === k ? 'border-accent text-accent bg-accent/10' : 'border-edge text-muted'}">${l}</button>`).join('')}
  </div>
  <div class="rounded-2xl border border-edge bg-surface p-4 mb-5 flex items-center gap-4 fadein">
    <span class="block rounded-full bg-surface2 overflow-hidden shrink-0">${myAvatar(52)}</span>
    <div class="flex-1"><p class="text-xs text-muted">${tab === 'now' ? 'Your current points' : 'Your lifetime points'}</p><p class="font-display text-2xl font-semibold text-accent">${mine.toLocaleString()}</p></div>
    ${rank ? `<div class="text-right"><p class="text-xs text-muted">Rank</p><p class="font-display text-2xl font-semibold">#${rank}</p></div>` : ''}
  </div>
  ${body}`;
}

let pendingFiles = []; // {name, text} uploaded but not yet turned into a note
function renderFileStatus(){
  const box = $('#fileBox'), inline = $('#fileInline');
  if(!box || !inline) return;
  inline.innerHTML = pendingFiles.length
    ? `<span class="text-accent">✓ File added: ${pendingFiles.map(f=>escapeHtml(f.name)).join(', ')}</span> <span class="text-muted">— will be combined with the text above</span>`
    : '';
  box.innerHTML = pendingFiles.map((f,i)=>`
    <div class="flex items-center justify-between gap-3 rounded-xl border border-accent/40 bg-accent/10 px-4 py-3 fadein" role="status">
      <div class="min-w-0"><p class="text-sm font-medium text-accent">✓ File added</p>
      <p class="text-xs text-muted truncate">${escapeHtml(f.name)} · ${f.text.length.toLocaleString()} characters read</p></div>
      <button data-rmfile="${i}" class="text-xs text-muted hover:text-bad shrink-0">Remove</button>
    </div>`).join('');
  box.querySelectorAll('[data-rmfile]').forEach(b => b.onclick = () => { pendingFiles.splice(+b.dataset.rmfile,1); renderFileStatus(); });
}

  const circumference = 2 * Math.PI * 54;
  const offset = circumference - (pct/100) * circumference;
  return `
  <header class="pt-10 pb-4 text-center fadein">
    <p class="text-muted text-sm">${escapeHtml(quiz.title)}</p>
    <div class="relative w-36 h-36 mx-auto mt-4">

  <header class="pt-10 pb-6 fadein">
    <button data-nav="home" class="text-muted text-sm hover:text-ink">← New notes</button>
    <h1 class="font-display text-2xl font-semibold mt-3">History & progress</h1>
  </header>
  ${points.length ? `<div data-anim="scale" class="card p-5 rounded-2xl border border-edge bg-surface mb-6">
      <p class="text-sm text-muted mb-3">Score over time (${points.length} attempt${points.length>1?'s':''})</p>
      ${chart}
    </div>` : ''}
  <div class="space-y-3">
    ${rows.length ? rows.map((q, i) => {
      const qa = attempts.filter(a=>a.quizId===q.id);
      const best = qa.length ? Math.max(...qa.map(a=>a.score)) : null;
      return `<div data-anim="up" style="--i:${i % 6}" class="card p-4 rounded-xl border border-edge bg-surface flex items-center justify-between">
        <div>
          <p class="font-medium">${escapeHtml(q.title)}</p>
          <p class="text-xs text-muted mt-0.5 capitalize">${q.difficulty} · ${q.questions.length} questions${q.topic?` · ${escapeHtml(q.topic)}`:''}</p>
        </div>
        <div class="text-right">
          <p class="text-accent font-display font-semibold">${best!==null?best+'%':'—'}</p>
          <button data-retake="${q.id}" class="text-xs text-muted hover:text-ink">Retake</button>
        </div>
      </div>`;
    }).join('') : `<p class="text-muted text-sm">No quizzes yet — go generate one.</p>`}
  </div>
  <button data-clear class="w-full text-center text-xs text-muted hover:text-bad mt-8">Clear all saved data</button>`;
}
function sparkline(points){
  const w=280,h=60,max=100,min=0;
  const step = w/(points.length-1||1);
  const pts = points.map((p,i)=>`${(i*step).toFixed(1)},${(h-(p-min)/(max-min)*h).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-16"><polyline points="${pts}" fill="none" style="stroke:rgb(var(--accent))" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/`/g,'&#96;'); }

/* ---------- render + events ---------- */
function render(){
  const views = { home:viewHome, configure:viewConfigure, quiz:viewQuiz, results:viewResults, history:viewHistory, shop:viewShop, board:viewBoard, landing:viewLanding, account:viewAccount };
  const key = animKey(), fresh = key !== renderedKey; renderedKey = key;
  stopAnims(); applyTheme();
  root.className = (state.view === 'landing' ? 'max-w-5xl' : 'max-w-2xl') + ' mx-auto px-5 pb-16';
  root.innerHTML = (state.view === 'quiz' ? '' : topBar() + (state.flash ? `<div class="mt-4 rounded-xl border border-accent/40 bg-accent/10 px-4 py-3 text-sm" role="status">${escapeHtml(state.flash)}</div>` : '')) + views[state.view]();
  bindEvents();
  setupAnims(fresh);
  if(state.view === 'landing') startDemo();
}
async function busy(btn, label, fn){
  const t = btn.textContent; btn.disabled = true; btn.textContent = label;
  try{ return await fn(); } finally{ if(btn.isConnected){ btn.disabled = false; btn.textContent = t; } }
}
function bindEvents(){
  root.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
  root.querySelectorAll('[data-start]').forEach(b => b.onclick = () => go(profile.account ? 'home' : 'account', { acctTab:'create', next:'home' }));
  root.querySelectorAll('[data-scroll]').forEach(b => b.onclick = () => {
    const t = document.getElementById(b.dataset.scroll);
    if(t && t.scrollIntoView) t.scrollIntoView({ behavior:'smooth', block:'start' });
  });
  root.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => {
    if(b.dataset.armed !== '1'){
      b.dataset.armed = '1'; b.textContent = 'Tap again to clear everything on this device';
      b.classList.add('text-bad');
      setTimeout(() => { if(b.isConnected){ b.dataset.armed = ''; b.textContent = 'Clear data on this device'; b.classList.remove('text-bad'); } }, 4000);
      return;
    }
    notes = []; quizzes = []; attempts = []; pendingFiles = []; resetProfile();
    ['ntq_notes','ntq_quizzes','ntq_attempts','ntq_profile'].forEach(k => localStorage.removeItem(k));
    go('landing', { flash: 'This device was cleared. Your account, if you have one, is still saved.' });
  });

  if(state.view === 'home'){
    renderFileStatus();
    $('#continueBtn').onclick = () => {
      const typed = $('#noteText').value.trim();
      const combined = [typed, ...pendingFiles.map(f => f.text.trim())].filter(Boolean).join('\n\n');
      if(!combined){ $('#homeError').textContent = 'Add some notes first — paste text or upload a file.'; $('#noteText').focus(); return; }
      const title = $('#noteTitle').value.trim() || (pendingFiles[0] ? pendingFiles[0].name.replace(/\.[^.]+$/,'') : 'Untitled notes');
      const note = { id: uid(), title, content: combined, sections: splitSections(combined) };
      notes.push(note); save(); pendingFiles = [];
      go('configure', { noteId: note.id });
    };
    $('#fileInput').onchange = async (e) => {
      const files = [...e.target.files]; if(!files.length) return;
      const label = $('#uploadLabel'); const original = label.textContent;
      const err = $('#homeError'); err.textContent = '';
      label.textContent = 'Reading file…';
      for(const f of files){
        try{
          const text = await extractFileText(f);
          if(!text.trim()){ err.textContent = `We couldn't find readable text in "${f.name}" — try pasting it instead.`; continue; }
          pendingFiles.push({ name: f.name, text });
          if(!$('#noteTitle').value.trim()) $('#noteTitle').value = f.name.replace(/\.[^.]+$/,'');
        } catch(ex){
          console.error(ex);
          err.textContent = `Couldn't read "${f.name}". Use a .txt, .pdf, .docx or .pptx file — or paste your notes.`;
        }
      }
      renderFileStatus();
      label.textContent = original;
      e.target.value = '';
    };
  }

  if(state.view === 'configure'){
    let difficulty = 'medium';
    let types = new Set(['mcq','true_false','short_answer']);
    root.querySelectorAll('.diff-btn').forEach(b => b.onclick = () => {
      difficulty = b.dataset.diff;
      root.querySelectorAll('.diff-btn').forEach(x => x.className = 'diff-btn flex-1 rounded-xl border px-3 py-2.5 text-sm capitalize border-edge text-muted');
      b.className = 'diff-btn flex-1 rounded-xl border px-3 py-2.5 text-sm capitalize border-accent text-accent bg-accent/10';
    });
    root.querySelectorAll('.type-btn').forEach(b => b.onclick = () => {
      const t = b.dataset.type;
      if(types.has(t) && types.size > 1){ types.delete(t); b.className = 'type-btn rounded-xl border border-edge text-muted px-3 py-2.5 text-sm'; }
      else if(!types.has(t)){ types.add(t); b.className = 'type-btn rounded-xl border border-accent text-accent bg-accent/10 px-3 py-2.5 text-sm'; }
    });
    $('#generateBtn').onclick = () => {
      const note = notes.find(n => n.id === state.noteId);
      const topic = $('#cfgTopic').value;
      const count = Math.max(3, Math.min(20, parseInt($('#cfgCount').value) || 8));
      const source = topic ? note.sections.filter(s=>s.heading===topic).map(s=>s.text).join('\n') : note.content;
      const questions = generateQuestions(source, difficulty, count, [...types]);
      if(!questions.length){ $('#cfgError').textContent = 'Could not generate questions from that text — try adding more detailed notes.'; return; }
      const quiz = { id: uid(), noteId: note.id, title: note.title, topic, difficulty, questions, createdAt: Date.now() };
      quizzes.push(quiz); save();
      go('quiz', { quizId: quiz.id, qIndex: 0, answers: {} });
    };
  }

  if(state.view === 'quiz'){
    const quiz = quizzes.find(q => q.id === state.quizId);
    const q = quiz.questions[state.qIndex];
    root.querySelectorAll('.opt-btn').forEach(b => b.onclick = () => { state.answers[q.id] = b.dataset.opt; render(); });
    root.querySelector('[data-nav-quiz="prev"]').onclick = () => go('quiz', { qIndex: Math.max(0, state.qIndex-1) });
    $('#nextBtn').onclick = () => {
      if(q.type === 'short_answer') state.answers[q.id] = $('#shortAnswer').value.trim();
      if(state.qIndex === quiz.questions.length - 1){
        const answers = quiz.questions.map(qq => {
          const given = state.answers[qq.id] || '';
          return { question_id: qq.id, prompt: qq.prompt, given, answer: qq.answer, source: qq.source, correct: isCorrect(qq.type, given, qq.answer) };
        });
        const total = answers.length;
        const correctCount = answers.filter(a=>a.correct).length;
        const score = Math.round((correctCount / total) * 1000) / 10;
        const earned = correctCount * PTS_PER_CORRECT;
        profile.points += earned; profile.lifetime += earned;
        attempts.push({ id: uid(), quizId: quiz.id, score, earned, answers, createdAt: Date.now() }); save(); syncBoard();
        go('results');
        requestAnimationFrame(() => {
          const ring = $('#scoreRing'); if(!ring) return;
          const c = 2*Math.PI*54; ring.style.strokeDashoffset = c - (score/100)*c;
        });
      } else {
        go('quiz', { qIndex: state.qIndex + 1 });
      }
    };
  }

  if(state.view === 'results'){
    $('#retakeBtn').onclick = () => {
      const quiz = quizzes.find(q => q.id === state.quizId);
      const note = notes.find(n => n.id === quiz.noteId);
      const source = quiz.topic ? note.sections.filter(s=>s.heading===quiz.topic).map(s=>s.text).join('\n') : note.content;
      const questions = generateQuestions(source, quiz.difficulty, quiz.questions.length, [...new Set(quiz.questions.map(q=>q.type))]);
      const newQuiz = { ...quiz, id: uid(), questions, createdAt: Date.now() };
      quizzes.push(newQuiz); save();
      go('quiz', { quizId: newQuiz.id, qIndex: 0, answers: {} });
    };
  }

  if(state.view === 'shop'){
    root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { state.shopTab = b.dataset.tab; state.shopMsg = ''; state.sellArm = ''; render(); });
    root.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
      const it = getItem(b.dataset.buy), price = TIERS[it.tier].price;
      if(profile.owned.includes(it.id) || profile.points < price) return;
      profile.points -= price; profile.owned.push(it.id); profile.equipped[it.cat] = it.id; save();
      state.shopMsg = `Bought ${it.name} (${TIERS[it.tier].name}) — equipped!`; state.sellArm = ''; syncBoard(); render();
    });
    root.querySelectorAll('[data-equip]').forEach(b => b.onclick = () => {
      const it = getItem(b.dataset.equip); if(!profile.owned.includes(it.id)) return;
      profile.equipped[it.cat] = it.id; save(); state.shopMsg = `Equipped ${it.name}`; state.sellArm = ''; syncBoard(); render();
    });
    const un = root.querySelector('[data-unequip]');
    if(un) un.onclick = () => { profile.equipped.costume = null; save(); state.shopMsg = 'Costume removed'; state.sellArm = ''; syncBoard(); render(); };
    root.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => {
      const it = getItem(b.dataset.sell);
      if(!it || it.tier === 'starter' || !profile.owned.includes(it.id)) return;
      if(state.sellArm !== it.id){ state.sellArm = it.id; render(); return; }   // first tap arms, second confirms
      const val = sellValue(it);
      profile.owned = profile.owned.filter(x => x !== it.id);
      if(profile.equipped[it.cat] === it.id) profile.equipped[it.cat] = it.cat === 'theme' ? 'theme_default' : it.cat === 'color' ? 'color_default' : null;
      profile.points += val; save();
      state.sellArm = ''; state.shopMsg = `Sold ${it.name} for ${val} pts`; syncBoard(); render();
    });
  }

  if(state.view === 'account'){
    root.querySelectorAll('[data-atab]').forEach(b => b.onclick = () => { state.acctTab = b.dataset.atab; state.acctMsg = ''; state.delOpen = false; state.signoutArm = false; state.backupCode = ''; render(); });
    root.querySelectorAll('[data-showpw]').forEach(b => b.onclick = () => {
      const i = document.getElementById(b.dataset.showpw), show = i.type === 'password';
      i.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show';
    });
    const pwn = $('#pwNew');
    if(pwn) pwn.oninput = () => {
      const s = strengthOf(pwn.value), bar = $('#pwBar'), lab = $('#pwLabel');
      bar.style.width = ['0%','33%','66%','100%'][s]; bar.style.background = ['transparent','#FB7185','#FACC15','#4ADE80'][s];
      lab.textContent = ['Use 8 or more characters. Longer is stronger.','Weak: add length, numbers or symbols.','Okay: a little longer would be better.','Strong password.'][s];
    };
    const after = msg => state.next ? go(state.next) : go('account', { acctTab: 'manage', acctMsg: msg });

    const lb = $('#loginBtn');
    if(lb) lb.onclick = () => busy(lb, 'Logging in…', async () => {
      const err = $('#loginErr'); err.textContent = '';
      const u = cleanNick($('#loginUser').value), pw = $('#loginPw').value;
      if(!hasCrypto()){ err.textContent = NO_CRYPTO; return; }
      if(!u || !pw){ err.textContent = 'Enter your username and password.'; return; }
      let r; try{ r = await loginAccount(u, pw); } catch(e){ r = { error: OFFLINE_MSG }; }
      if(r.error){ err.textContent = r.error; return; }
      after(`Logged in as ${profile.account.nick}.`);
    });
    const cb = $('#createBtn');
    if(cb) cb.onclick = () => busy(cb, 'Securing…', async () => {
      const err = $('#createErr'); err.textContent = '';
      if(!hasCrypto()){ err.textContent = NO_CRYPTO; return; }
      const u = cleanNick($('#newUser').value), p1 = $('#pwNew').value, p2 = $('#pwConfirm').value;
      const bad = usernameError(u) || passwordError(p1, u) || (p1 !== p2 ? 'The two passwords do not match.' : '');
      if(bad){ err.textContent = bad; return; }
      let r; try{ r = await createPasswordAccount(u, p1); } catch(e){ r = { error: OFFLINE_MSG }; }
      if(r.error){ err.textContent = r.error; return; }
      after('Your account is ready.');
    });
    const chb = $('#changeBtn');
    if(chb) chb.onclick = () => busy(chb, 'Securing…', async () => {
      const err = $('#pwErr'); err.textContent = '';
      const o = $('#pwOld').value, p1 = $('#pwNew').value, p2 = $('#pwConfirm').value;
      if(!hasCrypto()){ err.textContent = NO_CRYPTO; return; }
      const bad = !o ? 'Enter your current password.' : passwordError(p1, profile.account.nick) || (p1 !== p2 ? 'The two new passwords do not match.' : '');
      if(bad){ err.textContent = bad; return; }
      let r; try{ r = await changePassword(o, p1); } catch(e){ r = { error: OFFLINE_MSG }; }
      if(r.error){ err.textContent = r.error; return; }
      go('account', { acctTab: 'manage', acctMsg: 'Password changed.' });
    });
    const bki = $('#bkInBtn');
    if(bki) bki.onclick = () => busy(bki, 'Checking…', async () => {
      state.bkOpen = true;
      const err = $('#bkErr'); err.textContent = '';
      if(!hasCrypto()){ err.textContent = NO_CRYPTO; return; }
      const code = $('#bkIn').value, pw = $('#bkInPw').value;
      if(!code.trim() || !pw){ err.textContent = 'Paste the backup code and enter the account password.'; return; }
      let r; try{ r = await importBackup(code, pw); } catch(e){ r = { error: OFFLINE_MSG }; }
      if(r.error){ err.textContent = r.error; return; }
      after(`Logged in as ${profile.account.nick}.`);
    });
    const bkm = $('#bkMakeBtn');
    if(bkm) bkm.onclick = () => busy(bkm, 'Securing…', async () => {
      const err = $('#bkMakeErr'); err.textContent = '';
      const pw = $('#bkPw').value;
      if(!hasCrypto()){ err.textContent = NO_CRYPTO; return; }
      if(!pw){ err.textContent = 'Enter your password to make a backup code.'; return; }
      let r; try{ r = await makeBackup(pw); } catch(e){ r = { error: OFFLINE_MSG }; }
      if(r.error){ err.textContent = r.error; return; }
      state.backupCode = r.code; state.acctMsg = ''; refreshAccount();
    });
    const bkc = $('#bkCopyBtn');
    if(bkc) bkc.onclick = async () => {
      const msg = $('#bkCopyMsg'), ta = $('#bkOut');
      try{ await navigator.clipboard.writeText(ta.value); msg.textContent = 'Copied. Paste it on your other device.'; }
      catch(e){ ta.focus(); ta.select(); msg.textContent = 'Press Ctrl+C (or Cmd+C) to copy the selected code.'; }
    };
    const gb = $('#guestBtn');
    if(gb) gb.onclick = () => {
      const typed = cleanNick($('#newUser') ? $('#newUser').value : '');
      profile.account = { nick: nickError(typed) ? 'Guest' : typed, mode: 'guest', createdAt: Date.now() }; save();
      state.next ? go(state.next) : go('account', { acctTab: 'manage', acctMsg: 'You are playing as a guest.' });
    };
    const rs = $('#restoreBtn');
    if(rs) rs.onclick = () => {
      const remote = cloudProfile;
      if(remoteIsAhead(remote)) adoptProfile(remote);
      profile.account = { nick: String(remote.nick).slice(0, 20), mode: 'cloud', createdAt: remote.createdAt || Date.now() };
      lastCloudSig = ''; save(); syncBoard(); after('Welcome back!');
    };
    const rn = $('#renameBtn');
    if(rn) rn.onclick = () => {
      const nick = cleanNick($('#renameInput').value), bad = nickError(nick);
      if(bad){ $('#renameErr').textContent = bad; return; }
      profile.account.nick = nick; save(); syncBoard(); go('account', { acctTab: 'manage', acctMsg: 'Name updated.' });
    };
    const so = $('#signoutBtn');
    if(so && !so.disabled) so.onclick = async () => {
      if(!state.signoutArm){ state.signoutArm = true; render(); return; }
      await flushSync(); resetProfile(); go('landing', { flash: 'You are signed out.' });
    };
    const dob = $('#delOpenBtn'); if(dob) dob.onclick = () => { state.delOpen = true; render(); };
    const dc = $('#delCancelBtn'); if(dc) dc.onclick = () => { state.delOpen = false; render(); };
    const dg = $('#delGoBtn');
    if(dg) dg.onclick = () => busy(dg, 'Deleting…', async () => {
      const err = $('#delErr'); err.textContent = '';
      const a = profile.account, pw = $('#delPw') ? $('#delPw').value : '';
      if(a && a.mode === 'password'){
        if(!hasCrypto()){ err.textContent = NO_CRYPTO; return; }
        if(!pw){ err.textContent = 'Enter your password to confirm.'; return; }
      }
      let r; try{ r = await deleteAccount(pw, $('#delNotes').checked); } catch(e){ r = { error: OFFLINE_MSG }; }
      if(r.error){ err.textContent = r.error; return; }
      go('landing', { flash: a ? 'Your account was deleted.' : 'Data on this device was deleted.' });
    });
  }

  if(state.view === 'board'){
    root.querySelectorAll('[data-btab]').forEach(b => b.onclick = () => { state.boardTab = b.dataset.btab; render(); });
  }

  if(state.view === 'history'){
    root.querySelectorAll('[data-retake]').forEach(b => b.onclick = () => {
      go('quiz', { quizId: b.dataset.retake, qIndex: 0, answers: {} });
    });
  }
}

render();
initBoard();
</script>
</body>
</html>
